<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Tiệm Hoa Yêu Thương</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">🌸 FlowerShop</div>
    <nav class="nav">
        <a href="/">Trang Chủ</a>
        <a href="/cart" class="cart-link">
            🛒 Giỏ Hàng
            <span class="cart-badge" th:text="${cartCount}">0</span>
        </a>
    </nav>
</header>

<main class="main">

    <h1 class="page-title">Tiệm Hoa Yêu Thương 🌺</h1>

    <!-- FORM TÌM KIẾM -->
    <!-- method="GET": gửi từ khóa lên URL dạng /?keyword=hồng -->
    <form action="/" method="GET" class="search-form">
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="🔍 Tìm kiếm theo tên hoa..."
               class="search-input">
        <button type="submit" class="btn-search">Tìm</button>
        <!-- Nếu đang tìm kiếm thì hiện nút Xóa để về lại tất cả -->
        <a href="/" class="btn-clear" th:if="${keyword != null and keyword != ''}">✕ Xóa</a>
    </form>

    <!-- DANH SÁCH HOA -->
    <div class="product-grid">

        <!-- th:each: vòng lặp, tạo 1 card cho mỗi bông hoa -->
        <div class="product-card" th:each="flower : ${flowers}">
            <img th:src="${flower.imageUrl}" th:alt="${flower.name}" class="product-img">
            <div class="product-info">
                <h3 th:text="${flower.name}">Tên Hoa</h3>
                <p class="species" th:text="${flower.species}">Loài hoa</p>
                <p class="price" th:text="${#numbers.formatInteger(flower.price, 0, 'COMMA') + ' VNĐ'}">0 VNĐ</p>
                <p class="stock" th:text="'Còn: ' + ${flower.stockQuantity} + ' bông'">Còn: 0 bông</p>

                <!-- Nút thêm vào giỏ -->
                <form action="/cart/add" method="POST">
                    <input type="hidden" name="flowerId" th:value="${flower.id}">
                    <button type="submit" class="btn-cart">🛒 Thêm vào giỏ</button>
                </form>

                <!-- Nút xem chi tiết -->
                <a th:href="@{/detail/{id}(id=${flower.id})}" class="btn-detail">Chi tiết</a>
            </div>
        </div>

        <!-- Hiện thông báo nếu không tìm thấy hoa nào -->
        <div th:if="${flowers.empty}" class="empty-msg">
            <p>😔 Không tìm thấy hoa nào phù hợp!</p>
        </div>

    </div>

    <!-- PHÂN TRANG -->
    <!-- Chỉ hiện nếu có hơn 1 trang -->
    <div class="pagination" th:if="${totalPages > 1}">

        <!-- Nút Trước -->
        <a th:href="@{/(page=${currentPage - 1}, keyword=${keyword})}"
           th:classappend="${currentPage == 1} ? 'disabled'"
           class="page-link">&laquo; Trước</a>

        <!-- Số trang -->
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:href="@{/(page=${i}, keyword=${keyword})}"
               th:text="${i}"
               th:classappend="${i == currentPage} ? 'active'"
               class="page-link">1</a>
        </th:block>

        <!-- Nút Sau -->
        <a th:href="@{/(page=${currentPage + 1}, keyword=${keyword})}"
           th:classappend="${currentPage == totalPages} ? 'disabled'"
           class="page-link">Sau &raquo;</a>

    </div>

</main>

<footer class="footer">
    <p>© 2026 Tiệm Hoa Yêu Thương 🌸</p>
</footer>

<script src="/js/script.js"></script>
</body>
</html>
