# Địa chỉ database - flower_shop_simple là tên database bạn sẽ tạo trong MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/flower_shop_simple?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

# Tên đăng nhập MySQL (mặc định thường là root)
spring.datasource.username=root

# Mật khẩu MySQL của bạn
spring.datasource.password=123456

# Driver kết nối MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động tạo/cập nhật bảng trong database dựa theo model Java
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL trong console để dễ debug
spring.jpa.show-sql=true

# App chạy ở cổng 8080
server.port=8080

# Tắt cache HTML khi dev, sửa HTML thấy ngay không cần restart
spring.thymeleaf.cache=false
