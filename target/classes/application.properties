# 1. Cấu hình kết nối Database
# Ưu tiên biến môi trường SPRING_DATASOURCE_URL đã cài trên Render, nếu không có sẽ dùng localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flower_shop_simple?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

# Tên đăng nhập (Render dùng SPRING_DATASOURCE_USERNAME, Local dùng root)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# Mật khẩu (Render dùng SPRING_DATASOURCE_PASSWORD, Local dùng 123456)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

# Driver kết nối MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình Hibernate & JPA
# Tự động tạo/cập nhật bảng trong database
spring.jpa.hibernate.ddl-auto=update
# Hiển thị SQL ra console để debug
spring.jpa.show-sql=true
# Chỉ định Dialect cụ thể để tránh lỗi nhận diện trên Cloud
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

# 3. Cấu hình Server & Thymeleaf
# Render thường cấp cổng qua biến PORT, mặc định là 8080
server.port=${PORT:8080}

# Tắt cache để dev cho nhanh
spring.thymeleaf.cache=false