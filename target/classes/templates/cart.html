<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Giỏ Hàng</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">🌸 FlowerShop</div>
    <nav class="nav">
        <a href="/">Trang Chủ</a>
        <a href="/cart" class="cart-link">
            🛒 Giỏ Hàng
            <span class="cart-badge" th:text="${cartCount}">0</span>
        </a>
    </nav>
</header>

<main class="main">

    <h1 class="page-title">🛒 Giỏ Hàng</h1>

    <!-- Nếu giỏ hàng TRỐNG -->
    <div th:if="${cartItems.empty}" class="empty-cart">
        <p>😔 Giỏ hàng của bạn đang trống!</p>
        <a href="/" class="btn-detail">Tiếp tục mua sắm</a>
    </div>

    <!-- Nếu giỏ hàng CÓ SẢN PHẨM -->
    <div th:if="${!cartItems.empty}">

        <!-- DANH SÁCH SẢN PHẨM TRONG GIỎ -->
        <div class="cart-list">
            <div class="cart-item" th:each="item : ${cartItems}">

                <!-- Ảnh hoa -->
                <img th:src="${item.flower.imageUrl}"
                     th:alt="${item.flower.name}"
                     class="cart-img">

                <!-- Thông tin -->
                <div class="cart-item-info">
                    <h3 th:text="${item.flower.name}">Tên hoa</h3>
                    <p th:text="'Đơn giá: ' + ${#numbers.formatInteger(item.flower.price, 0, 'COMMA')} + ' VNĐ'">Đơn giá</p>
                    <p th:text="'Số lượng: ' + ${item.quantity}">Số lượng</p>
                    <p class="line-total" th:text="'Thành tiền: ' + ${#numbers.formatInteger(item.lineTotal, 0, 'COMMA')} + ' VNĐ'">Thành tiền</p>
                </div>

                <!-- Nút xóa -->
                <form action="/cart/remove" method="POST">
                    <input type="hidden" name="flowerId" th:value="${item.flower.id}">
                    <button type="submit" class="btn-remove">✕ Xóa</button>
                </form>

            </div>
        </div>

        <!-- TỔNG TIỀN -->
        <div class="cart-total">
            <p th:text="'Tổng tiền: ' + ${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + ' VNĐ'">
                Tổng tiền: 0 VNĐ
            </p>
        </div>

        <!-- NÚT ĐIỀU HƯỚNG -->
        <div class="cart-actions">
            <a href="/" class="btn-detail">← Tiếp tục mua sắm</a>
        </div>

    </div>

</main>

<footer class="footer">
    <p>© 2026 Tiệm Hoa Yêu Thương 🌸</p>
</footer>

<script src="/js/script.js"></script>
</body>
</html>
